<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada — Palavra Viva</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 2rem;
        background: #f4efe3;
        color: #1b2a4a;
        font-family: Verdana, sans-serif;
        line-height: 1.5;
      }
      main { max-width: 38rem; }
      p:first-child { color: #f05a47; font-size: 1.1rem; font-weight: 700; }
      h1 { margin: 0.2rem 0 0.8rem; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05; }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.1rem;
        border: 2px solid #1b2a4a;
        border-radius: 8px;
        background: #2457e6;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #101827; color: #f5f0e4; }
        a { border-color: #f5f0e4; }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Palavra Viva · 404</p>
      <h1>Esta página não está no caderno.</h1>
      <p>O endereço pode estar incompleto ou a página pode ter mudado de sítio.</p>
      <a href="/">Voltar ao início</a>
    </main>
  </body>
</html>
