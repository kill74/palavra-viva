name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Configurar o Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependências
        run: deno install --frozen

      - name: Gerar os tipos do SvelteKit
        run: deno task sync

      - name: Construir com a base do GitHub Pages
        run: deno task build
        env:
          BASE_PATH: /palavra-viva

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar o artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
