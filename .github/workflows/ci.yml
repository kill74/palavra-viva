name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar e construir
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar o Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependências
        run: deno install --frozen

      - name: Verificar tipos e acessibilidade
        run: deno task check

      - name: Construir o site estático
        run: deno task build

      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: palavra-viva-build
          path: build/
          retention-days: 7
